<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>💌 Love Letter Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Kanit:wght@300;400;600&family=Mali:wght@400;600&family=Pridi:wght@300;400&family=Sriracha&family=Prompt:wght@400;600&family=Sarabun:wght@400;600&family=Mitr:wght@400;600&family=Pattaya&family=Chonburi&family=Charmonman&family=Srisakdi&family=Maitree:wght@400;600&family=Kodchasan:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:'Kanit','Sarabun',system-ui,sans-serif;background:#fdeef3;color:#3b1d3a;min-height:100vh}

/* ---------- BUILDER ---------- */
#app{max-width:620px;margin:0 auto;padding:18px 14px 120px}
.hero{padding:22px 6px 8px}
.hero h1{margin:0;font-family:'Sriracha','Mali',cursive;font-weight:400;font-size:34px;line-height:1.15;color:#c2185b}
.hero p{margin:8px 0 0;color:#7d4a73;font-size:14px;line-height:1.5}
.card{background:#fff;border-radius:22px 22px 22px 6px;margin:12px 0;box-shadow:0 2px 0 #f3c6d9,0 10px 24px -12px rgba(194,24,91,.35);overflow:hidden}
.card>summary{padding:15px 18px;font-weight:600;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:'＋';color:#c2185b;font-weight:300}
.card[open]>summary::after{content:'－'}
.body{padding:2px 18px 18px;display:grid;gap:13px}
.ifw{display:grid;gap:13px}
.f{display:grid;gap:5px;font-size:14px}
.f>span{color:#8a5a86;font-size:13px}
.f .val{color:#c2185b}
input[type=text],textarea,select{width:100%;padding:10px 12px;border:1.5px solid #f1d3e6;border-radius:12px;font:inherit;background:#fffafd;color:inherit}
input[type=text]:focus,textarea:focus,select:focus{outline:2px solid #e0306f;outline-offset:1px}
textarea{resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:#e0306f}
.chk{display:flex;align-items:center;gap:10px}
.chk input{width:20px;height:20px;accent-color:#e0306f}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #f1d3e6;background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;color:#3b1d3a}
.chip.on{background:#e0306f;color:#fff;border-color:#e0306f}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.col{display:flex;align-items:center;gap:8px}
input[type=color]{width:40px;height:34px;padding:0;border:1.5px solid #f1d3e6;border-radius:9px;background:none}
.btn{border:none;border-radius:999px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;background:#e0306f;color:#fff}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#ffe3ee;color:#b0124f}
.btn.sm{padding:8px 14px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.file{display:inline-block;cursor:pointer}
.file input{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}
.thumb{position:relative;width:72px;height:72px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.thumb b{position:absolute;top:-7px;right:-7px;background:#e0306f;color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:11px;cursor:pointer}
.hint{font-size:12px;color:#9a7195;line-height:1.5;margin:0}
audio{width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;background:rgba(253,238,243,.92);backdrop-filter:blur(12px);z-index:20;justify-content:center}
.bar .btn{flex:1;max-width:300px}
.sheet{position:fixed;inset:0;background:rgba(50,10,40,.55);display:grid;align-items:end;z-index:300}
.sheet .in{background:#fff;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:grid;gap:12px;max-width:620px;width:100%;margin:0 auto}
.sheet h3{margin:0;font-family:'Sriracha',cursive;font-weight:400;font-size:24px;color:#c2185b}
.link{word-break:break-all;background:#ffe9f1;padding:12px;border-radius:12px;font-weight:600;color:#b0124f;font-size:14px}

/* ---------- VIEWER ---------- */
.vroot,.vroot *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vroot{position:fixed;inset:0;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2));font-family:var(--font);z-index:100;color:var(--hint)}
.vroot canvas{position:absolute;inset:0;pointer-events:none}
.vroot .fall{z-index:1}
.vroot .fx{z-index:20}
.envwrap{position:absolute;transform:translate(-50%,-50%) scale(var(--s));z-index:3;text-align:center;cursor:pointer;transition:opacity .5s,transform .6s}
.envwrap.gone{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(var(--s)) translateY(50px)}
.envelope{position:relative;width:var(--ew,300px);height:var(--eh,200px);filter:drop-shadow(0 16px 22px rgba(0,0,0,.28));animation:bob 3.2s ease-in-out infinite}
.envwrap.started .envelope{animation:none}
@keyframes bob{50%{transform:translateY(-8px) rotate(-.6deg)}}
.e-back{position:absolute;inset:0;border-radius:6px;background:color-mix(in srgb,var(--env),#000 30%)}
.e-vedge{position:absolute;inset:0;z-index:3;pointer-events:none;background:rgba(0,0,0,.28);clip-path:polygon(0 0,50% var(--fh,112px),100% 0,100% 5px,50% calc(var(--fh,112px) + 5px),0 5px)}
.e-letter{position:absolute;left:6%;right:6%;top:6%;height:88%;background:var(--paper);border-radius:4px;z-index:2;padding:16px 14px;display:flex;flex-direction:column;gap:10px;transition:transform .7s cubic-bezier(.3,1.35,.5,1) .5s}
.e-letter i{display:block;height:5px;border-radius:3px;background:color-mix(in srgb,var(--text),transparent 82%)}
.e-letter i:nth-child(2){width:80%}.e-letter i:nth-child(3){width:90%}.e-letter i:nth-child(4){width:55%}
.e-pocket{position:absolute;inset:0;z-index:3;border-radius:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--env),#fff 10%),var(--env));clip-path:polygon(0 0,50% var(--fh,112px),100% 0,100% 100%,0 100%)}
.e-flap{position:absolute;left:0;top:0;width:100%;height:var(--fh,112px);z-index:4;background:var(--flap);transform-origin:top;clip-path:polygon(0 0,100% 0,50% 100%);transition:transform .6s ease,z-index 0s .3s}
.e-seal{position:absolute;left:50%;top:var(--fh,112px);transform:translate(-50%,-50%);z-index:5;font-size:36px;line-height:1;transition:.35s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.opened .e-flap{transform:perspective(700px) rotateX(180deg);z-index:1}
.opened .e-letter{transform:translateY(calc(var(--lift,80px) * -1))}
.opened .e-seal{opacity:0;transform:translate(-50%,-50%) scale(.2)}
.e-hint{margin-top:30px;font-weight:600;font-size:17px;animation:blink 1.8s ease-in-out infinite}
.envwrap.started .e-hint{opacity:0;animation:none}
@keyframes blink{50%{opacity:.45}}

.reader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;z-index:6;opacity:0;pointer-events:none;transition:opacity .4s}
.reader.show{opacity:1;pointer-events:auto}
.paper{position:relative;max-height:100%;overflow:auto;background:var(--paper);color:var(--text);border-radius:20px;padding:30px 22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 0 0 6px color-mix(in srgb,var(--accent),transparent 86%);transform:translateY(70px) scale(.6) rotate(-3deg);transition:transform .7s cubic-bezier(.2,1.4,.4,1)}
.reader.show .paper{transform:none}
.paper .x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:18px;color:var(--text);opacity:.5;cursor:pointer;padding:6px}
.paper h2{margin:4px 0 12px;text-align:center;font-size:1.5em;line-height:1.3;color:var(--accent)}
.paper .body{display:block;padding:0;gap:0;margin:0 0 14px;white-space:pre-wrap;line-height:1.75;word-break:break-word}
.paper .body .h{visibility:hidden}
.paper .sign{margin:0 0 14px;text-align:right;font-weight:600}
.photos{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 16px}
.photos:empty{display:none}
.photos figure{margin:0;width:var(--ps);max-width:100%}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block;box-shadow:0 6px 16px rgba(0,0,0,.22)}
.sh-circle img{border-radius:50%}
.sh-rounded img{border-radius:20px}
.sh-heart img{clip-path:url(#hc);box-shadow:none}
.sh-polaroid figure{background:#fff;padding:8px 8px 30px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.sh-polaroid img{box-shadow:none}
.tilt figure:nth-child(odd){transform:rotate(-3deg)}
.tilt figure:nth-child(even){transform:rotate(3deg)}
.btns{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;padding:8px 0 4px;min-height:20px}
.vb{border:0;font:inherit;font-weight:600;padding:12px 22px;cursor:pointer;color:#fff;background:var(--accent);box-shadow:0 6px 14px rgba(0,0,0,.22);touch-action:manipulation}
.vb.pill{border-radius:999px}.vb.round{border-radius:14px}.vb.sq{border-radius:3px}
.vb.yes{transform:scale(var(--g,1));transition:transform .25s;animation:glow 1.8s infinite}
@keyframes glow{50%{box-shadow:0 6px 24px color-mix(in srgb,var(--accent),transparent 30%)}}
.vb.no{background:color-mix(in srgb,var(--text),#fff 45%);transition:transform .2s}
.vb.fled{position:absolute;z-index:30;margin:0;transition:left .25s,top .25s}
.btns.in .vb{animation:popin .5s backwards}
@keyframes popin{from{opacity:0;transform:scale(.4)}}
.result{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;background:color-mix(in srgb,var(--bg1),transparent 12%);backdrop-filter:blur(6px);color:var(--hint)}
.result .big{font-size:96px;animation:beat 1s infinite}
@keyframes beat{30%{transform:scale(1.2)}60%{transform:scale(.95)}}
.result h1{margin:0;font-size:32px;line-height:1.25;color:var(--accent)}
.result p{margin:0 0 12px;font-size:18px}
.toast{position:absolute;left:50%;bottom:11%;transform:translate(-50%,20px);background:rgba(30,10,30,.82);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.splash{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:color-mix(in srgb,var(--bg2),transparent 25%);backdrop-filter:blur(8px);transition:opacity .5s}
.splash.hide{opacity:0;pointer-events:none}
.splash .card{background:var(--paper);color:var(--text);border-radius:26px;padding:28px 24px;text-align:center;max-width:320px;box-shadow:0 20px 50px rgba(0,0,0,.3);display:grid;gap:14px;margin:0}
.splash .em{font-size:64px;animation:beat 1.4s infinite}
.splash h2{margin:0;font-size:22px;line-height:1.4}
.pv-close{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:99;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer}
@media (prefers-reduced-motion:reduce){.envelope,.e-hint,.splash .em,.result .big{animation:none}}

.result{overflow:auto;justify-content:flex-start}
.rin{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.rletter{background:var(--paper);color:var(--text);border-radius:16px;padding:14px 16px;max-width:min(380px,100%);white-space:pre-wrap;line-height:1.7;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.rletter:empty{display:none}
.result .photos{justify-content:center;margin:4px 0}
a.vb{text-decoration:none;display:inline-block}
.sad .big{animation:drop 2.4s ease-in-out infinite}
@keyframes drop{50%{transform:translateY(8px) rotate(-6deg)}}
.vroot.shake{animation:shk .6s}
@keyframes shk{10%,50%,90%{transform:translate(-8px,2px)}30%,70%{transform:translate(8px,-2px)}}
.flash{position:absolute;inset:0;background:#fff;z-index:60;pointer-events:none;animation:fl .7s forwards}
@keyframes fl{from{opacity:.9}to{opacity:0}}
.sub{border:1.5px solid #f6dbe8;border-radius:16px;padding:12px;display:grid;gap:10px;background:#fffafd}.subh{font-weight:600;color:#c2185b}
.bpv{display:flex;justify-content:center;padding:8px;background:linear-gradient(160deg,#ffd9e8,#ff9ec4);border-radius:12px}
.mini{padding:4px 10px;font-size:12px}.f.col{flex-wrap:wrap}.isauto>label span::after{content:' · ตามธีม';color:#b99;font-size:12px}.isauto .mini{display:none}
.jump{position:sticky;top:0;z-index:30;display:flex;gap:8px;overflow-x:auto;padding:8px 2px;background:rgba(253,238,243,.94);backdrop-filter:blur(8px);scrollbar-width:none}.jump .chip{flex:none;padding:6px 12px;white-space:nowrap}.card{scroll-margin-top:58px}
.grp{display:grid;gap:12px;padding-top:14px;border-top:1.5px dashed #f1d3e6}.grp:first-child{border-top:0;padding-top:0}
.gh{font-weight:600;color:#c2185b;font-size:14px}
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.pat{border:1.5px solid #f1d3e6;background:#fff;border-radius:12px;padding:4px;display:grid;gap:3px;font:inherit;cursor:pointer;color:#3b1d3a}
.pat i{display:block;height:42px;border-radius:8px;background-color:#fffafd;background-repeat:repeat}
.pat small{font-size:11px;text-align:center;line-height:1.2}
.pat.on{border-color:#e0306f;box-shadow:0 0 0 2px rgba(224,48,111,.25)}
.pat[data-pv=none] i{background-image:linear-gradient(135deg,transparent 45%,rgba(255,255,255,.9) 46% 54%,transparent 55%)}
/* viewer: ซอง/การ์ด ส่วนเสริม */
.envelope{isolation:isolate}
.e-air,.e-frame{position:absolute;inset:0;pointer-events:none;display:none}
.e-frame{z-index:6}
.bgp{position:absolute;inset:0;pointer-events:none;z-index:0}
.paper .pframe{position:absolute;pointer-events:none;display:none}
.e-strip{position:absolute;left:0;top:0;width:100%;height:30px;z-index:4;background:var(--flap);display:none;transform-origin:left top;transition:transform .7s ease,opacity .5s ease;border-radius:6px 6px 0 0;border-bottom:2px dashed rgba(0,0,0,.28)}
.opened .e-strip{transform:translate(60px,-70px) rotate(18deg);opacity:0}
.e-tie{position:absolute;inset:0;z-index:5;pointer-events:none;display:none;transition:opacity .4s,transform .5s}
.e-tie i{position:absolute;background:var(--tc,#e53935);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.e-tie i:nth-child(1){left:calc(50% - 9px);width:18px;top:0;bottom:0}
.e-tie i:nth-child(2){top:calc(62% - 9px);height:18px;left:0;right:0}
.e-tie b{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font-size:34px;line-height:1;font-weight:400}
.opened .e-tie{opacity:0;transform:scale(1.06)}
/* builder: เทมเพลต แบบร่าง แจ้งเตือน ตัวอย่างหลายขนาดจอ */
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{border:1.5px solid #f1d3e6;background:#fff;border-radius:16px;padding:10px;text-align:left;font:inherit;cursor:pointer;display:grid;gap:4px;color:#3b1d3a;align-content:start}
.tpl:active{transform:scale(.98)}
.tpl b{font-size:26px;line-height:1;font-weight:400}.tpl span{font-weight:600;font-size:14px}
.tpl small{color:#9a7195;font-size:11.5px;line-height:1.35}
.tpl .sw{display:flex;gap:4px}.tpl .sw u{width:14px;height:14px;border-radius:50%;display:inline-block;text-decoration:none;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.dlist{display:grid;gap:8px}
.dit{display:flex;align-items:center;gap:8px;border:1.5px solid #f6dbe8;border-radius:14px;padding:8px 10px;background:#fffafd}
.dit>div{flex:1;min-width:0;display:grid}.dit b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dit small{color:#9a7195;font-size:11.5px}
.ntf{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:#c2185b;color:#fff;padding:11px 18px;border-radius:999px;z-index:500;box-shadow:0 10px 28px rgba(194,24,91,.4);font-weight:600;font-size:14px;max-width:92%;text-align:center}
.seen{background:#fff5f9;border:1.5px solid #f6dbe8;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.8;color:#7d4a73}
.pvtools{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:101;display:flex;gap:6px;background:rgba(20,10,30,.78);padding:6px;border-radius:999px;backdrop-filter:blur(8px)}
.pvtools .chip{padding:6px 12px;font-size:13px;white-space:nowrap}
#pvBack{position:fixed;inset:0;background:rgba(20,12,30,.92);z-index:99}
.late{margin:0 0 12px;text-align:center}.late p{margin:8px 0 0;white-space:pre-wrap;line-height:1.7;animation:popin .7s backwards}
.pgi{text-align:center;font-size:13px;opacity:.65;margin:2px 0 8px}.pgi:empty{display:none}
.insl{position:absolute;inset:0;z-index:7;display:grid;place-items:center;pointer-events:none}
.insi{pointer-events:auto;cursor:pointer;max-width:78%;text-align:center;transform:rotate(var(--r,0deg));animation:pull .7s cubic-bezier(.2,1.2,.4,1) backwards;transition:transform .35s,opacity .35s;color:var(--text)}
.insi.out{transform:translateY(-110vh) rotate(14deg);opacity:0}
@keyframes pull{from{transform:translateY(160px) scale(.4) rotate(-10deg);opacity:0}}
.insi img{display:block;width:min(240px,100%);aspect-ratio:1;object-fit:cover;margin:0 auto}
.insi.polaroid{background:#fff;padding:12px 12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.35)}.insi.polaroid .ic{font-family:'Sriracha','Mali',cursive;color:#444;margin-top:10px;font-size:18px}
.insi.photo img{border:6px solid #fff;box-shadow:0 14px 34px rgba(0,0,0,.35)}.insi.photo .ic{margin-top:10px;font-weight:600}
.insi.card{background:var(--paper);padding:22px 20px;border-radius:14px;min-width:200px;box-shadow:0 14px 34px rgba(0,0,0,.35),inset 0 0 0 4px color-mix(in srgb,var(--accent),transparent 80%)}.insi.card img{width:120px;border-radius:10px;margin-bottom:10px}.insi.card .ic{white-space:pre-wrap;line-height:1.6;font-size:18px}
.insi .ic:empty{display:none}.insi small{display:block;margin-top:12px;font-size:12px;opacity:.8;color:var(--hint)}.insi.polaroid small{color:#777}.insi.card small{color:var(--text)}
.mpl{position:absolute;left:10px;top:calc(54px + env(safe-area-inset-top));z-index:45;display:flex;gap:6px;align-items:flex-start;transition:transform .3s}
.mpl iframe{border:0;border-radius:12px;width:min(300px,78vw);height:152px;background:#000}.mpl.sp iframe{height:80px}
.mpl button{border:0;border-radius:50%;width:34px;height:34px;background:rgba(0,0,0,.55);color:#fff;font-size:16px;cursor:pointer}
.mpl.min{transform:translateX(calc(-100% + 38px))}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><clipPath id="hc" clipPathUnits="objectBoundingBox"><path d="M0.5,0.95 C0.1,0.62 0,0.42 0,0.28 C0,0.1 0.14,0 0.28,0 C0.38,0 0.46,0.05 0.5,0.14 C0.54,0.05 0.62,0 0.72,0 C0.86,0 1,0.1 1,0.28 C1,0.42 0.9,0.62 0.5,0.95Z"/></clipPath></svg>
<div id="app"></div>
<div id="viewerRoot" class="vroot" hidden></div>

<script>
/* =========================================================
   ข้อมูลตั้งต้น / ธีม
   ========================================================= */
const THEMES={
  pink:    {bg1:'#ffd9e8',bg2:'#ff9ec4',env:'#ff7aa8',flap:'#ff5c93',paper:'#fff8fb',text:'#7a2848',accent:'#e0306f',hint:'#7a2848'},
  night:   {bg1:'#1b1642',bg2:'#3a2f7d',env:'#5648a5',flap:'#6a5bc2',paper:'#fdf6e3',text:'#2b2550',accent:'#e8a317',hint:'#fdf6e3'},

      else{xctx.font=`${b.size}px ${EMOJI_FONT}`;xctx.fillText(b.e,0,0)}
      xctx.restore();
    }
    raf=requestAnimationFrame(frame);
  }
  frame();cleanup.push(()=>cancelAnimationFrame(raf));
  if(fallOn){for(let i=0;i<num(F.count,40);i++)P.push(mkP(-20,H))}

  /* ---------- เสียงพื้นหลัง/เสียงที่อัด ---------- */
  const A=c.audio,ML=A.source==='link'?parseMusic(A.link):null;let au=null,mp=null;
  const linkPlay=()=>{if(!ML||mp)return;mp=document.createElement('div');mp.className='mpl '+ML.k;mp.innerHTML='<iframe allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><button type="button">🎵</button>';mp.firstChild.src=ML.src;mp.lastChild.onclick=()=>mp.classList.toggle('min');root.appendChild(mp);if(ML.k==='sp')toast('แตะ ▶ ที่เครื่องเล่นเพื่อฟังเพลง 🎵',3500)};
  const linkStop=()=>{if(mp){mp.remove();mp=null}};cleanup.push(linkStop);
  if(A.src&&A.source!=='link'){
    au=new Audio(A.src);au.loop=!!A.loop;au.volume=num(A.vol,80)/100;au.preload='auto';
    cleanup.push(()=>{au.pause();au.removeAttribute('src');au.load()});
  }
  const playAu=()=>{if(ML)return linkPlay();if(au){au.muted=false;au.play().catch(()=>{})}};
  const unlockAu=()=>{if(!au)return;au.muted=true;au.play().then(()=>{au.pause();au.currentTime=0;au.muted=false}).catch(()=>{au.muted=false})};

  let yau=null;
  if(AF.audio==='own'&&AF.ya&&AF.ya.src){yau=new Audio(AF.ya.src);yau.preload='auto';yau.volume=num(A.vol,80)/100;cleanup.push(()=>{yau.pause();yau.removeAttribute('src');yau.load()})}

  /* ---------- เริ่ม / เปิดซอง ---------- */
  let started=false,opened=false,typed=false;
  function gate(){
    if(opt.onClose)return true;
    if(AV.unlockOn&&AV.unlockAt){const t=new Date(AV.unlockAt).getTime();if(t>Date.now()){const m=Math.ceil((t-Date.now())/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60);toast((AV.lockMsg||'ยังไม่ถึงเวลา')+' (อีก '+(d?d+' วัน ':'')+(h?h+' ชม. ':'')+(m%60)+' นาที)',4000);return false}}
    if(AV.pass){const a=prompt(AV.passHint||'ใส่รหัส');if(a===null)return false;if(a.trim()!==String(AV.pass).trim()){toast('รหัสไม่ถูกต้อง 🔒',2500);return false}}
    return true;
  }
  q('.go').onclick=()=>{
    if(started||!gate())return;started=true;ping('start');armLate('start');sfx(c.btn.sound);splash.classList.add('hide');
    to(()=>splash.remove(),600);
    if(A.trigger==='start')playAu();
    else{unlockAu();if(A.trigger==='timer')to(playAu,Math.max(0,num(A.delay,5))*1000)}
  };
  function showReader(){
    reader.classList.add('show');envwrap.classList.add('gone');
    if(!typed){typed=true;armLate('read');showPage(0)}
  }
  function openLetter(){
    if(!started)return;
    if(!opened){
      opened=true;ping('open');armLate('open');openFx();envwrap.classList.add('started');envelope.classList.add('opened');sfx(c.btn.sound);
      if(A.trigger==='open')playAu();
      if(F.type!=='none'&&F.when==='afterOpen'){fallOn=true}
      to(()=>INS.length?runIns(0):showReader(),1500);
    }else showReader();
  }
  envwrap.addEventListener('click',openLetter);
  q('.paper .x').onclick=()=>{reader.classList.remove('show');envwrap.classList.remove('gone');result.hidden=true};

  /* ---------- พิมพ์ข้อความทีละตัว ---------- */
  function typeBody(done,txt){typing=true;const d0=done;done=()=>{typing=false;d0()};txt=txt||'';
    if(!c.text.typewriter||!txt){bodyEl.textContent=txt;bodyEl.hidden=!txt;return done()}
    bodyEl.innerHTML='<span class="v"></span><span class="h"></span>';
    const v=bodyEl.firstChild,h=bodyEl.lastChild,ch=Array.from(txt);let i=0,skip=false;
    const onTap=()=>{skip=true};paper.addEventListener('click',onTap);
    (function step(){
      if(skip)i=ch.length;
      v.textContent=ch.slice(0,i).join('');h.textContent=ch.slice(i).join('');
      if(i<ch.length){i++;to(step,55)}else{paper.removeEventListener('click',onTap);to(done,250)}
    })();
  }

  /* ---------- ปุ่มตอบรับ / ปุ่มหนี ---------- */
  let noEl=null;
  function buildButtons(){
    const B=c.btn;btns.innerHTML='';if(B.mode==='none')return;
    const mk=(cls,t)=>{const b=document.createElement('button');b.className='vb '+B.shape+' '+cls;b.textContent=t;return b};
    const yes=mk('yes',B.yes||'ตกลง');btns.appendChild(yes);
    yes.onclick=()=>{sfx(B.sound);ping('yes');sayYes()};
    let g=1;const growYes=()=>{g=Math.min(g+.1,1.7);yes.style.setProperty('--g',g)};
    if(B.mode==='two'){
      const no=mk('no',B.no||'ไม่');btns.appendChild(no);noEl=no;
      const lines=(B.cycle||'').split(/[,\n]/).map(s=>s.trim()).filter(Boolean);let n=0;
      const say=()=>toast(lines[n++%lines.length]||'');
      if(B.noMode==='run'){
        let last=0;
        const go=e=>{e.preventDefault();const t=Date.now();if(t-last<300)return;last=t;flee(no,yes);growYes();ping('no');sfx(B.noSound);say()};
        no.addEventListener('pointerenter',go);no.addEventListener('pointerdown',go);no.addEventListener('touchstart',go,{passive:false});no.addEventListener('click',go);
      }else if(B.noMode==='shrink'){
        let sc=1;no.onclick=()=>{ping('no');sfx(B.noSound);say();growYes();sc-=.2;if(sc<=.15)no.style.display='none';else no.style.transform=`scale(${sc})`};
      }else if(B.noMode==='cycle'){
        no.onclick=()=>{ping('no');sfx(B.noSound);growYes();no.textContent=lines[n++%lines.length]||B.no};
      }else if(B.noMode==='sad'){
        no.onclick=()=>{ping('no');sfx(B.noSound);growYes();sad.hidden=false};
      }else{no.onclick=()=>{ping('no');sfx(B.noSound);say()}}
    }
    btns.classList.add('in');
  }
  function flee(no,yes){
    const rr=root.getBoundingClientRect(),K=root.offsetWidth/(rr.width||1),W0=root.offsetWidth,H0=root.offsetHeight;
    if(no.parentNode!==root){
      const b=no.getBoundingClientRect();
      const ph=document.createElement('span');ph.style.cssText=`display:inline-block;width:${b.width*K}px;height:${b.height*K}px`;
      no.replaceWith(ph);root.appendChild(no);no.classList.add('fled');
      no.style.left=(b.left-rr.left)*K+'px';no.style.top=(b.top-rr.top)*K+'px';void no.offsetWidth;
    }
    const bw=no.offsetWidth,bh=no.offsetHeight,yb=yes.getBoundingClientRect();
    const yl=(yb.left-rr.left)*K,yr=(yb.right-rr.left)*K,yt=(yb.top-rr.top)*K,ybt=(yb.bottom-rr.top)*K;
    const cur={x:parseFloat(no.style.left),y:parseFloat(no.style.top)};
    let x,y,t=0,hit,near;
    do{
      x=rand(10,Math.max(11,W0-bw-10));y=rand(10,Math.max(11,H0-bh-10));t++;
      hit=x<yr+12&&x+bw>yl-12&&y<ybt+12&&y+bh>yt-12;
      near=Math.hypot(x-cur.x,y-cur.y)<90;
    }while(t<40&&(hit||near));
    no.style.left=x+'px';no.style.top=y+'px';
  }
  function safeUrl(u){u=String(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return''}}
  function sayYes(){
    const X=AF,msg=[c.btn.yesResult,c.btn.yesSub].filter(Boolean).join(' · ');
    if(noEl)noEl.style.display='none';
    if(X.screen==='full'){

    }else if(X.screen==='toast')toast(msg,3500);
    if(X.bgOn&&/^#[0-9a-f]{3,8}$/i.test(X.bg||'')){root.style.setProperty('--bg1',X.bg);root.style.setProperty('--bg2','color-mix(in srgb,'+X.bg+',#000 22%)')}
    runEffects();

    else if(X.audio==='stop'){linkStop();if(au)au.pause()}
    else if(X.audio==='own'){linkStop();if(au)au.pause();if(yau){yau.currentTime=0;yau.play().catch(()=>{})}}
    const url=safeUrl(X.link);
    if(url&&X.linkMode==='button'){const a=q('.rlink');a.href=url;a.textContent=X.linkLabel||'เปิดดูเลย';a.hidden=false;if(X.screen!=='full')btns.appendChild(a)}
    else if(url&&X.linkMode==='redirect'){const d=Math.max(1,num(X.linkDelay,4))*1000;if(opt.onClose)to(()=>toast('(ตัวอย่าง) จะพาไปที่ '+url,3000),d);else to(()=>{location.href=url},d)}
  }
  q('.re').onclick=()=>{result.hidden=true;if(noEl)noEl.style.display=''};

  ping('load');
  return()=>{cleanup.forEach(f=>f());timers.forEach(clearTimeout);root.innerHTML='';root.className='vroot'};
}

function bindAll(){
  document.querySelectorAll('[data-k]').forEach(el=>{
    const v=get(S,el.dataset.k);
    if(el.type==='checkbox')el.checked=!!v;else if(el.dataset.fb){el.value=v||fbVal(el.dataset.fb);el.closest('.f').classList.toggle('isauto',!v)}else el.value=v==null?'':v;
    const out=el.closest('.f')&&el.closest('.f').querySelector('.val');if(out)out.textContent=el.value;
  });
  applyBPV();renderPats();
}
function mixHex(a,b,t){const g=x=>{x=x.replace('#','');if(x.length===3)x=[...x].map(y=>y+y).join('');return[0,2,4].map(i=>parseInt(x.substr(i,2),16))},A=g(a),B=g(b);return'#'+A.map((v,i)=>Math.round(v*(1-t/100)+B[i]*t/100).toString(16).padStart(2,'0')).join('')}
function fbVal(f){if(f[0]==='#')return f;if(f.startsWith('dark:')){const[,p,t]=f.split(':');return mixHex(get(S,p)||'#000000','#000000',+t)}if(f.startsWith('mix:')){const[,p,t]=f.split(':');return mixHex(get(S,p)||'#000000','#ffffff',+t)}return get(S,f)||'#000000'}
function applyBPV(){const ok=v=>/^#[0-9a-f]{3,8}$/i.test(v||''),C=S.colors;document.querySelectorAll('[data-bpv]').forEach(el=>{const k=el.dataset.bpv,b=S.ui.b[k];
  const bg=ok(b.bg)?b.bg:k==='no'?`color-mix(in srgb,${C.text},#fff 45%)`:C.accent,R={pill:'999px',round:'14px',sq:'3px'}[b.shape||S.btn.shape]||'999px';
  el.style.cssText=`background:${bg};color:${ok(b.fg)?b.fg:'#fff'};border-radius:${R};font-size:${b.scale/100}em;${b.bw>0?`border:${b.bw}px solid ${ok(b.bd)?b.bd:'currentColor'};`:''}box-shadow:${b.shadow===false?'none':'0 6px 14px rgba(0,0,0,.22)'}`})}
function updMl(){const e=$('#mlInfo');if(!e)return;const l=S.audio.link,m=parseMusic(l);e.textContent=!l?'':m?'✅ รองรับ: '+(m.k==='yt'?'YouTube':'Spotify'):'⚠️ ลิงก์นี้ใช้ไม่ได้ (รองรับวิดีโอ YouTube และเพลง/อัลบั้ม/เพลย์ลิสต์ Spotify)'}

function fileToImg(file,max,type='image/jpeg',q=.84){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL(type,q))};im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

function markEff(){const a=S.btn.after.effects||[];document.querySelectorAll('[data-eff]').forEach(b=>b.classList.toggle('on',a.includes(b.dataset.eff)))}
let rec=null,recTimer=null;
async function toggleRec(id,getObj,onDone){
  const btn=document.getElementById(id);
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[],lbl=btn.textContent;const r=rec=new MediaRecorder(st);
    r.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    r.onstop=async()=>{
      clearInterval(recTimer);st.getTracks().forEach(t=>t.stop());btn.textContent=lbl;
      const o=getObj();o.src=await blobToData(new Blob(chunks,{type:r.mimeType||'audio/webm'}));o.name='เสียงที่อัดไว้';
      onDone();persist();
    };
    r.start();let n=0;btn.textContent='⏹️ หยุดอัด 0s';
    recTimer=setInterval(()=>{n++;btn.textContent='⏹️ หยุดอัด '+n+'s'},1000);
  }catch(err){alert('เปิดไมค์ไม่ได้ ต้องเปิดเว็บผ่าน http://localhost หรือลิงก์ https และกดอนุญาตไมค์ก่อน')}
}

/* ---------- แบบร่างหลายชุด (IndexedDB) ---------- */
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('llStudio',1);r.onupgradeneeded=()=>r.result.createObjectStore('drafts',{keyPath:'name'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async tx(mode,fn){const d=await DB.open();return new Promise((res,rej)=>{const t=d.transaction('drafts',mode),rq=fn(t.objectStore('drafts'));t.oncomplete=()=>{d.close();res(rq&&rq.result)};t.onerror=()=>rej(t.error)})},
  put(o){return DB.tx('readwrite',s=>s.put(o))},all(){return DB.tx('readonly',s=>s.getAll())},del(n){return DB.tx('readwrite',s=>s.delete(n))}
};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function renderDrafts(){
  const box=$('#draftList');if(!box)return;
  try{
    const list=(await DB.all()||[]).sort((a,b)=>b.t-a.t);
    box.innerHTML=list.length?list.map(d=>`<div class="dit"><div><b>${esc(d.name)}</b><small>${d.tpl?'⭐ เทมเพลต · ':''}${new Date(d.t).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})} · ${(JSON.stringify(d.cfg).length/1048576).toFixed(1)} MB</small></div><button type="button" class="btn ghost sm" data-dload="${encodeURIComponent(d.name)}">เปิด</button><button type="button" class="btn ghost sm" data-ddel="${encodeURIComponent(d.name)}">🗑️</button></div>`).join(''):'<p class="hint">ยังไม่มีแบบร่างที่บันทึกไว้</p>';
  }catch(e){box.innerHTML='<p class="hint">เบราว์เซอร์นี้เก็บแบบร่างไม่ได้ (อาจอยู่ในโหมดส่วนตัว)</p>'}
}
async function saveDraft(){
  const inp=$('#dName');let name=(inp.value||'').trim()||('แบบร่าง '+new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'}));
  try{
    const ex=(await DB.all()||[]).some(d=>d.name===name);
    if(ex&&!confirm('มีแบบร่างชื่อ "'+name+'" อยู่แล้ว เขียนทับไหม?'))return;

  }catch(e){alert('บันทึกแบบร่างไม่สำเร็จ')}
}

const DEV={full:null,s:[320,568],m:[390,844],t:[768,1024]};

const DEVP=['inset','left','top','width','height','transform','borderRadius','boxShadow'];
function setDev(k){
  curDev=k;const r=$('#viewerRoot'),d=DEV[k];
  document.querySelectorAll('[data-dev]').forEach(b=>b.classList.toggle('on',b.dataset.dev===k));
  DEVP.forEach(p=>r.style[p]='');
  $('#pvBack').hidden=!d;
  if(d){
    const sc=Math.min(1,(innerWidth-24)/d[0],(innerHeight-86)/d[1]);
    Object.assign(r.style,{inset:'auto',left:'50%',top:'calc(50% - 30px)',width:d[0]+'px',height:d[1]+'px',transform:`translate(-50%,-50%) scale(${sc})`,borderRadius:'28px',boxShadow:'0 0 0 10px #1c1224,0 30px 80px rgba(0,0,0,.6)'});

/* ---------- แจ้งเตือนเมื่อมีคนเปิดอ่าน ---------- */
let watchT=null,watchSeen=null,bannerT=null;
const EVN={load:'👀 เปิดลิงก์แล้ว',start:'👆 แตะปุ่มเริ่มแล้ว',open:'💌 เปิดซองแล้ว',yes:'💖 กดปุ่มตอบรับแล้ว!',no:'😤 กดปุ่มปฏิเสธ'};
function showBanner(msg){
  const b=$('#ntf');if(!b)return;b.textContent=msg;b.hidden=false;clearTimeout(bannerT);bannerT=setTimeout(()=>{b.hidden=true},5000);
}
function notify(msg){
  showBanner(msg);try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
  try{if('Notification' in window&&Notification.permission==='granted')new Notification('Love Letter Studio',{body:msg})}catch(e){}
}
function seenHtml(sn){
  sn=sn||{};const rows=Object.keys(EVN).filter(k=>sn[k]).sort((a,b)=>sn[a]-sn[b]).map(k=>`${EVN[k]} · ${new Date(sn[k]*1000).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}${(sn[k+'_n']||0)>1?' (×'+sn[k+'_n']+')':''}`);
  return rows.length?rows.join('<br>'):'⏳ ยังไม่มีใครเปิดลิงก์';
}
function stopWatch(){clearInterval(watchT);watchT=null}
function startWatch(id){
  stopWatch();watchSeen=null;
  const poll=async()=>{
    try{
      const st=await (await fetch('/api/status',{headers:{'X-Owner':ownerId()}})).json();
      if(!st.active||st.id!==id){stopWatch();return}
      const sn=st.seen||{};
      if(watchSeen!==null)for(const k in EVN){const n=sn[k+'_n']||0,o=watchSeen[k+'_n']||0;if(n>o&&(k!=='no'||o===0))notify(EVN[k])}
      watchSeen=sn;const b=$('#seenBox');if(b)b.innerHTML=seenHtml(sn);
    }catch(e){}
  };
  poll();watchT=setInterval(poll,4000);
}

 miss:{n:'🌙 คิดถึง',t:'คิดถึง{to}',o:['ช่วงนี้นึกถึงเธอบ่อยมากเลย~','ไม่ได้เจอกันนานแล้วนะ~'],m:['เห็นอะไรก็นึกถึงเธอไปหมด~','อยากเล่าเรื่องวันนี้ให้เธอฟังจัง~'],c:['เจอกันเร็วๆ นี้นะ~','ดูแลตัวเองด้วยนะ~']},
 anni:{n:'💞 ครบรอบ',t:'ครบรอบของเรา',o:['เวลาผ่านไปเร็วมากเลย~','ขอบคุณที่อยู่ด้วยกันมาถึงวันนี้~'],m:['ทุกวันกับเธอคือความทรงจำที่ดีที่สุด~','ผ่านเรื่องดีและเรื่องแย่มาด้วยกัน~'],c:['ขออยู่ด้วยกันแบบนี้ไปอีกนานๆ นะ~','รักเธอเหมือนวันแรกเลย~']}
};
const WT={sweet:{n:'💗 หวานซึ้ง',e:' นะ 💗',t:' 💗',i:''},cute:{n:'🥺 น่ารักขี้เล่น',e:' น้าา 🥺',t:' ✨',i:'แงงง มีเรื่องจะบอก 🥺'},sincere:{n:'🤍 จริงใจ นุ่มลึก',e:'',t:'',i:''},funny:{n:'😆 ตลกกวนๆ',e:' 😆',t:' 😝',i:'ประกาศจากกองบัญชาการหัวใจ 📢'}};
let W=null;
function genDraft(){
  const o=WR[$('#wOcc').value],tn=WT[$('#wTone').value],to=($('#wTo').value||'').trim()||'เธอ',fr=($('#wFrom').value||'').trim(),ex=($('#wDetail').value||'').trim(),pk=a=>a[Math.floor(Math.random()*a.length)];
  const f=x=>x.replace(/~/g,tn.e).replace(/\{to\}/g,' '+to).replace(/ +/g,' ').trim();
  W={t:f(o.t)+tn.t,b:[tn.i,f(pk(o.o)),f(pk(o.m)),ex,f(pk(o.c))].filter(Boolean).join('\n'),s:fr?'จาก'+fr+tn.t:''};
  $('#wOut').textContent=W.t+'\n\n'+W.b+(W.s?'\n\n'+W.s:'');
}
function renderLists(){
  const L=(id,key,fn,add,max)=>{const b=$('#'+id);if(!b)return;const a=get(S,key)||[];b.innerHTML=a.map((x,i)=>`<div class="sub">${fn(x,key+'.'+i,i)}<button type="button" class="chip mini" data-lrm="${key}:${i}">🗑 ลบ</button></div>`).join('')+(a.length<max?`<button type="button" class="chip" data-ladd="${key}">${add}</button>`:'')};
  L('insBox','ins',(x,k,i)=>`${F_.sel('ชนิด',k+'.kind',[['polaroid','📸 โพลารอยด์'],['photo','🖼 ภาพถ่าย'],['card','💌 การ์ดใบเล็ก']])}<div class="row"><label class="btn ghost sm file">＋ เลือกรูป<input type="file" accept="image/*" data-insimg="${i}"></label>${x.img?'<img src="'+x.img+'" style="height:44px;border-radius:8px">':''}</div>${F_.txt('ข้อความ / คำบรรยาย',k+'.cap')}`,'＋ เพิ่มของในซอง',5);
  L('pgBox','text.pages',(x,k,i)=>`<div class="subh">หน้า ${i+2}</div>${F_.txt('หัวหน้านี้ (เว้นว่างได้)',k+'.t')}${F_.area('เนื้อหา',k+'.b',4)}`,'＋ เพิ่มหน้า',9);
  L('lateBox','late',(x,k)=>`${F_.area('ข้อความที่จะโผล่ทีหลัง',k+'.text',2)}${F_.rng('หลังผ่านไป',k+'.delay',1,120,1,' วินาที')}${F_.sel('นับจาก',k+'.from',[['read','เริ่มอ่านจดหมาย'],['open','เปิดซอง'],['start','แตะปุ่มเริ่ม']])}${F_.sel('โผล่แบบ',k+'.st',[['inline','ต่อท้ายในจดหมาย (หน้าสุดท้าย)'],['bubble','ข้อความลอยบนจอ']])}`,'＋ เพิ่มข้อความตั้งเวลา',5);
  bindAll();
}
function preCheck(){
  const w=[],a=S.audio,L=S.adv,sz=JSON.stringify(S).length/1048576;
  if(!(S.text.body||'').trim()&&!S.text.pages.some(p=>p.b))w.push('ยังไม่ได้เขียนเนื้อหาจดหมาย');
  if(!(S.text.title||'').trim())w.push('หัวจดหมายว่างอยู่');
  if(S.text.pages.some(p=>!p.b&&!p.t))w.push('มีหน้าเพิ่มที่ยังว่าง (จะถูกข้าม)');
  if(S.late.some(m=>!(m.text||'').trim()))w.push('มีข้อความตั้งเวลาที่ยังว่าง (จะถูกข้าม)');
  if(S.ins.some(x=>!x.img&&!x.cap))w.push('มีของในซองที่ยังไม่ใส่รูปหรือข้อความ (จะถูกข้าม)');
  if(a.source==='link'){if(!a.link)w.push('เลือกเพลงจากลิงก์ แต่ยังไม่ได้วางลิงก์');else if(!parseMusic(a.link))w.push('ลิงก์เพลงใช้ไม่ได้ (รองรับ YouTube / Spotify)')}
  else if(!a.src)w.push('ยังไม่ได้ใส่เสียงหรือเพลง (ไม่ใส่ก็ได้)');
  else if(a.src.length*.75>8*1048576)w.push('ไฟล์เสียงใหญ่กว่า 8 MB ลิงก์จะโหลดช้า');
  if(L.unlockOn&&!L.unlockAt)w.push('เปิดล็อกเวลาไว้ แต่ยังไม่ได้เลือกวันเวลา');
  if(S.btn.after.linkMode!=='none'&&!S.btn.after.link)w.push('ตั้งให้เปิดลิงก์หลังกดตอบรับ แต่ยังไม่ได้ใส่ลิงก์');
  if(sz>15)w.push('ข้อมูลรวม ~'+sz.toFixed(1)+' MB ผู้รับอาจโหลดช้า');
  return w;
}
async function saveTpl(){
  const inp=$('#dName'),nm=(inp.value||'').trim();if(!nm){alert('ตั้งชื่อเทมเพลตในช่องด้านบนก่อนนะ');return}
  const c=clone(S);c.photos=[];c.audio.src=null;c.audio.name='';c.adv.bgImg=null;c.fall.img=null;c.btn.after.ya={src:null,name:''};c.ins.forEach(x=>x.img=null);
  try{await DB.put({name:'⭐ '+nm,t:Date.now(),cfg:c,tpl:1});inp.value='';await renderDrafts();showBanner('เก็บเป็นเทมเพลต "'+nm+'" แล้ว เปิดได้จากรายการด้านบน (รูปและเสียงปัจจุบันจะไม่ถูกแทนที่)')}catch(e){alert('บันทึกไม่สำเร็จ')}
}

/* ---------- ตัวอย่าง ---------- */
let pvDestroy=null;
function openPreview(){
  const r=$('#viewerRoot');r.hidden=false;document.body.style.overflow='hidden';
  pvDestroy=mountViewer(r,S,{onClose:closePreview});
  $('#pvTools').hidden=false;setDev(curDev);
}
function closePreview(){if(pvDestroy)pvDestroy();pvDestroy=null;const r=$('#viewerRoot');r.hidden=true;DEVP.forEach(p=>r.style[p]='');$('#pvTools').hidden=true;$('#pvBack').hidden=true;document.body.style.overflow=''}

/* ---------- สร้างลิงก์แชร์ (ใช้ได้ 20 นาที / สร้างได้ทีละ 1 ลิงก์) ---------- */
function ownerId(){
  let o=localStorage.getItem('llOwner');
  if(!o){o=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('llOwner',o)}
  return o;
}
let linkTimer=null;
const fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function endView(title,msg){
  clearInterval(linkTimer);stopWatch();
  const box=$('#sheetIn');
  box.innerHTML=`<h3>${title}</h3><p class="hint">${msg}</p><div class="row"><button class="btn" id="newLnk">สร้างลิงก์ใหม่</button><button class="btn ghost" id="clLnk">ปิด</button></div>`;
  $('#newLnk').onclick=createLink;$('#clLnk').onclick=()=>{$('#sheet').hidden=true};
}
function showLink(id,remaining,note){
  const sheet=$('#sheet'),box=$('#sheetIn');sheet.hidden=false;
  const endAt=Date.now()+remaining*1000;
  let base=localStorage.getItem('llBase')||location.origin;
  clearInterval(linkTimer);
  const tick=()=>{
    const left=Math.max(0,Math.ceil((endAt-Date.now())/1000));
    const el=$('#tm');if(el)el.textContent=fmtT(left);
    if(left<=0)endView('ลิงก์หมดอายุแล้ว ⌛','ลิงก์และข้อมูลจดหมายถูกลบออกจากเซิร์ฟเวอร์แล้ว สร้างลิงก์ใหม่ได้เลย');
  };
  const draw=()=>{
    const url=base.replace(/\/$/,'')+'/l/'+id;
    box.innerHTML=`<h3>ลิงก์พร้อมส่งแล้ว 💌</h3>
      ${note?`<p class="hint" style="color:#c2185b">${note}</p>`:''}
      <div class="link" id="lnk">${url}</div>
      <div style="text-align:center;font-size:15px;color:#7d4a73">⏳ ลิงก์จะหมดอายุใน <b id="tm" style="color:#c2185b;font-size:22px;font-variant-numeric:tabular-nums">--:--</b></div>
      <div class="seen" id="seenBox"></div>
      <div class="row"><button class="btn" id="cpBtn">คัดลอกลิงก์</button><button class="btn ghost" id="shBtn">แชร์</button><a class="btn ghost" href="${url}" target="_blank" style="text-decoration:none">เปิดดู</a></div>
      <div class="row"><button class="btn ghost" id="delBtn" style="color:#c62828;border-color:#f3b4b4">🗑️ ลบลิงก์</button><button class="btn ghost" id="ntfBtn">🔔 แจ้งเตือน</button><button class="btn ghost" id="clLnk">ปิด</button></div>
      <label class="f"><span>ฐานลิงก์ (ใช้เมื่อมี tunnel/โดเมนอื่น)</span><input type="text" id="baseIn" value="${base}"></label>
      <p class="hint">ลิงก์ใช้ได้ 20 นาทีแล้วจะถูกลบอัตโนมัติ และสร้างได้ทีละ 1 ลิงก์ ถ้าจะสร้างใหม่ต้องรอหมดเวลาหรือกดลบก่อน</p>`;
    $('#baseIn').onchange=e=>{base=e.target.value.trim()||location.origin;localStorage.setItem('llBase',base);draw()};
    $('#cpBtn').onclick=async()=>{try{await navigator.clipboard.writeText(url);$('#cpBtn').textContent='คัดลอกแล้ว ✓'}catch(_){prompt('คัดลอกลิงก์นี้',url)}};
    $('#shBtn').onclick=()=>{navigator.share?navigator.share({title:'มีจดหมายถึงเธอ 💌',url}).catch(()=>{}):prompt('คัดลอกลิงก์นี้',url)};
    $('#clLnk').onclick=()=>{sheet.hidden=true};
    $('#ntfBtn').onclick=async()=>{
      if(!('Notification' in window)){showBanner('เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน แต่จะมีแถบแจ้งเตือนขึ้นบนหน้านี้เมื่อมีคนเปิด');return}
      try{const p=await Notification.requestPermission();showBanner(p==='granted'?'เปิดการแจ้งเตือนแล้ว 🔔':'ไม่ได้อนุญาตการแจ้งเตือน (ยังมีแถบแจ้งเตือนบนหน้านี้)')}catch(e){}
    };
    {const sb=$('#seenBox');if(sb)sb.innerHTML=seenHtml(watchSeen)}
    $('#delBtn').onclick=async()=>{
      if(!confirm('ลบลิงก์นี้เลยไหม? คนที่มีลิงก์จะเปิดไม่ได้อีก'))return;
      try{
        const r=await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json','X-Owner':ownerId()},body:JSON.stringify({id})});
        if(!r.ok&&r.status!==404)throw 0;
        endView('ลบลิงก์แล้ว 🗑️','ลิงก์นี้เปิดไม่ได้อีกแล้ว คุณสร้างลิงก์ใหม่ได้ทันที');
      }catch(_){alert('ลบไม่สำเร็จ ลองอีกครั้ง')}
    };
    tick();
  };
  draw();startWatch(id);
  linkTimer=setInterval(tick,1000);
}
async function createLink(){const w=preCheck(),sz=JSON.stringify(S).length/1048576;if(sz>58){alert('ข้อมูลรวม ~'+sz.toFixed(0)+' MB ใหญ่เกินกว่าเซิร์ฟเวอร์รับได้ (สูงสุด 60 MB) ลองลดรูปหรือเสียงก่อนนะ');return}if(w.length&&!confirm('ตรวจก่อนส่ง ⚠️\n• '+w.join('\n• ')+'\n\nสร้างลิงก์ต่อเลยไหม?'))return;
  const sheet=$('#sheet'),box=$('#sheetIn');sheet.hidden=false;
  clearInterval(linkTimer);
  box.innerHTML=`<h3>กำลังตรวจสอบ…</h3>`;
  const H={'X-Owner':ownerId()};
  try{
    const st=await (await fetch('/api/status',{headers:H})).json();
    if(st.active)return showLink(st.id,st.remaining,'⚠️ มีลิงก์ที่ยังใช้งานอยู่ ต้องรอหมดเวลาหรือกดลบก่อนจึงจะสร้างใหม่ได้');
    const mb=(JSON.stringify(S).length/1048576).toFixed(1);
    box.innerHTML=`<h3>กำลังสร้างลิงก์…</h3><p class="hint">ขนาดข้อมูล ~${mb} MB</p>`;
    const r=await fetch('/api/save',{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(S)});
    const j=await r.json().catch(()=>({}));
    if(r.status===409&&j.id)return showLink(j.id,j.remaining,'⚠️ มีลิงก์ที่ยังใช้งานอยู่ ต้องรอหมดเวลาหรือกดลบก่อนจึงจะสร้างใหม่ได้');
    if(!r.ok)throw new Error(j.error||('HTTP '+r.status));
    showLink(j.id,j.remaining);
  }catch(err){
    box.innerHTML=`<h3>สร้างลิงก์ไม่สำเร็จ</h3><p class="hint">${String(err.message||err)}<br>ตรวจสอบว่า server.py ยังทำงานอยู่ และเปิดเว็บผ่านที่อยู่ของ server (ไม่ใช่เปิดไฟล์ index.html ตรงๆ)</p><div class="row"><button class="btn ghost" onclick="$('#sheet').hidden=true">ปิด</button></div>`;
  }
}

/* =========================================================
   เริ่มต้น: ถ้า URL เป็น /l/xxxx = โหมดผู้รับ, ไม่งั้นเป็นหน้าสร้าง
   ========================================================= */
(function boot(){
  const m=location.pathname.match(/^\/l\/([a-z0-9]+)/);
  if(m){
    document.title='💌 มีจดหมายถึงเธอ';
    $('#app').hidden=true;const r=$('#viewerRoot');r.hidden=false;
    fetch('/api/letter/'+m[1]).then(x=>{if(!x.ok)throw 0;return x.json()}).then(cfg=>mountViewer(r,cfg))
      .catch(()=>{r.style.background='#fdeef3';r.innerHTML='<div style="display:grid;place-items:center;height:100%;text-align:center;font-family:Kanit,sans-serif;color:#7a2848;padding:24px"><div><div style="font-size:60px">💔</div><p>ไม่พบจดหมายฉบับนี้<br>ลิงก์อาจหมดอายุ (ใช้ได้ 20 นาที) หรือถูกลบแล้ว</p></div></div>'});
  }else{loadDraft();buildUI();try{fetch('/api/status',{headers:{'X-Owner':ownerId()}}).then(r=>r.json()).then(st=>{if(st.active)startWatch(st.id)}).catch(()=>{})}catch(e){}}
})();
</script>
